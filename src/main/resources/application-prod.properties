# Production overrides, activated by SPRING_PROFILES_ACTIVE=prod on Render.
# The H2 console is a live SQL shell — it must never be reachable on a public URL.
spring.h2.console.enabled=false

# Don't leak stack traces or SQL to public clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false

# Behind Render's proxy, honour X-Forwarded-* so generated URLs use https.
server.forward-headers-strategy=native

# Graceful shutdown so in-flight settlements finish during a redeploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
